# Scheduled data syncs (replaces the always-on scheduler process in production).
# Cron is UTC; times below are mapped from Eastern Standard Time (UTC-5). Before the
# November DST change they fire an hour later in local time, which is fine.
name: Sync league data

on:
  schedule:
    - cron: "0 10 * * *"        # nightly 5:00 ET: league, nfl, projections
    - cron: "45 14,16 * * 0"    # Sun 9:45 + 11:45 ET: projections (after inactives)
    - cron: "45 23 * * 1,4"     # Mon/Thu 18:45 ET: projections before prime time
    - cron: "*/30 15-23 * * 0"  # Sun 10:00-18:30 ET every 30 min: league (injuries, live scores)
    - cron: "*/30 0-4 * * 1"    # Sun 19:00-23:30 ET (Monday UTC): league
    - cron: "*/30 0-4 * * 2,5"  # Mon/Thu 19:00-23:30 ET (Tue/Fri UTC): league
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (space-separated: league nfl projections)"
        default: "league nfl projections"
      league:
        description: "Run one league's first sync instead (its id in the database)"
        default: ""

# never run two syncs of the same thing at once. A league's first sync gets its own group so a scheduled
# run can't bump it out of the queue, and advisory locks in sync_all keep them from colliding.
concurrency:
  group: sync-${{ inputs.league || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ESPN_SEASON: ${{ secrets.ESPN_SEASON }}
      CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Pick steps
        id: steps
        # inputs go through env, never interpolated into the script
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.steps }}
        run: |
          case "$SCHEDULE" in
            "0 10 * * *")                     steps="league nfl projections" ;;
            "45 14,16 * * 0"|"45 23 * * 1,4") steps="projections" ;;
            "")                               steps="$REQUESTED" ;;
            *)                                steps="league" ;;
          esac
          for s in $steps; do
            case "$s" in league|nfl|projections) ;; *) echo "unknown step: $s"; exit 1 ;; esac
          done
          echo "steps=$steps" >> "$GITHUB_OUTPUT"

      - name: Sync
        env:
          STEPS: ${{ steps.steps.outputs.steps }}
          LEAGUE: ${{ inputs.league }}
        # sync_all exits non-zero if a step fails, so GitHub emails you. Expired cookies don't count:
        # the app asks that member to reconnect. Logs here are public, so they only carry ids and counts.
        run: |
          if [ -n "$LEAGUE" ]; then
            case "$LEAGUE" in *[!0-9]*) echo "league must be a number"; exit 1 ;; esac
            uv run python manage.py sync_all --league "$LEAGUE"
          else
            uv run python manage.py sync_all --only $STEPS
          fi
