[project]
name = "fantasy-guru"
version = "0.1.0"
description = "ESPN fantasy football league analysis"
authors = [
    { name = "Alton Michaux", email = "alton.michaux@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "espn-api>=1.0.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "nflreadpy>=0.1.5",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
