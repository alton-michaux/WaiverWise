# Render Blueprint for WaiverWise. Dashboard → New → Blueprint → pick this repo.
# The database already exists, so it isn't declared here; paste its *Internal* URL as DATABASE_URL.
# Syncs run in GitHub Actions (.github/workflows/sync.yml), but connecting a league talks to ESPN from here.
services:
  - type: web
    name: waiverwise
    runtime: docker
    plan: free
    region: ohio              # must match the Render database's region (Ohio) for the internal URL to work
    branch: main              # production tracks main; dev → main PRs are releases
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CREDENTIAL_KEY  # same value as the Actions secret
        sync: false
      - key: GITHUB_DISPATCH_TOKEN  # fine-grained token limited to Actions on this repo
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
