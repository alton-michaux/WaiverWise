# Render Blueprint for WaiverWise. Dashboard → New → Blueprint → pick this repo.
# The database already exists, so it isn't declared here; paste its *Internal* URL as DATABASE_URL.
services:
  - type: web
    name: waiverwise
    runtime: docker
    plan: free
    region: oregon            # must match your Render database's region for the internal URL to work
    branch: master            # production tracks master; dev → master PRs are releases
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ESPN_LEAGUE_ID
        sync: false
      - key: ESPN_SEASON
        value: "2026"
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      - key: ESPN_MY_TEAM_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
