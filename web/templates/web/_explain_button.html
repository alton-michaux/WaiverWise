<div id="explain-{{ kind }}">
  <button class="{{ button_class|default:"secondary outline" }}" hx-get="{% url 'explain' kind %}?{{ request.GET.urlencode }}" hx-target="#explain-{{ kind }}" hx-swap="innerHTML" hx-indicator="this" hx-disabled-elt="this">
    <span class="when-idle">{{ label|default:"Explain this" }}</span><span class="when-busy">Claude is writing…</span>
  </button>
</div>
