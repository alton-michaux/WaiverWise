services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fantasy_guru
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: guru
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guru -d fantasy_guru"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://guru:guru@db:5432/fantasy_guru
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: python manage.py run_scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgres://guru:guru@db:5432/fantasy_guru
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
