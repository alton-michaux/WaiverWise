name: waiverwise

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waiverwise
      POSTGRES_USER: waiverwise
      POSTGRES_PASSWORD: waiverwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waiverwise -d waiverwise"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://waiverwise:waiverwise@db:5432/waiverwise
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: python manage.py run_scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgres://waiverwise:waiverwise@db:5432/waiverwise
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
